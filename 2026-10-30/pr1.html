<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 300px 300px;
            grid-template-areas: 
            "box1 box2"
            "box3 box3";
        }
        .box1{
            background-color: lightcoral;
            grid-area: box1;
        }
        .box2{
            background-image: url('images/tikin.png');
            background-color: lightblue;
            grid-area: box2;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 300px;
        }
        .box3{
            background-color: lightgreen;
            grid-area: box3;
        }
    </style>
</head>
<body>
    <div class="box">
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3">
            <h2>ニュース</h2><ul id="mylist"></ul><ul>
        </div>
    </div>
    <script src="pr1.js"></script>
</body>
</html>
